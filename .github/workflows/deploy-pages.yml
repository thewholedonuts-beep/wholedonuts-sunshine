name: Deploy public site to GitHub Pages

on:
  push:
    branches: [main]
    paths:
      - 'apps/public-site/**'
      - '.github/workflows/deploy-pages.yml'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
    validate:
      runs-on: ubuntu-latest
      steps:
        - uses: actions/checkout@v4
        - uses: actions/setup-node@v4
          with:
            node-version: 22
        - run: |
            node --check apps/public-site/app.js
            node --check apps/public-site/world/script.js

    deploy:
      needs: validate
      environment:
        name: github-pages
        url: ${{ steps.deployment.outputs.page_url }}
      runs-on: ubuntu-latest
      steps:
        - uses: actions/checkout@v4
        - uses: actions/configure-pages@v5
        - uses: actions/upload-pages-artifact@v3
          with:
            path: apps/public-site
        - id: deployment
          uses: actions/deploy-pages@v4
