name: Validate production services

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: production-deploy
  cancel-in-progress: false

jobs:
  # ── Run all test suites before deploy ──────────────────────
  test-merch:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        directory: [apps/merch/api, apps/merch/web]
    defaults:
      run:
        working-directory: ${{ matrix.directory }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: ${{ matrix.directory }}/package-lock.json
      - run: npm ci
      - run: npm run check
        env:
          NEXT_PUBLIC_API_BASE_URL: https://api.wenevergonnaclose.com/api
      - if: matrix.directory == 'apps/merch/api'
        run: npm test

  test-public-site:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: |
          node --check apps/public-site/app.js
          node --check apps/public-site/world/script.js

  test-universe:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/universe
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.22'
          cache-dependency-path: apps/universe/go.sum
      - run: go build ./...
      - run: go test ./...

  test-domain-funnels:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: tools/domain-funnels
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.21'
          cache-dependency-path: tools/domain-funnels/go.sum
      - run: go test ./...
