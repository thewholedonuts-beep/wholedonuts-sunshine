 <!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Whole Donuts | Walk In</title>
    <link rel="stylesheet" href="styles.css">
</head>

<body>
    <div class="container">
        <h1 class="title">How are U doing?</h1>

        <button id="walkIn" class="main-btn">Walk In</button>

        <div id="identitySelect" class="hidden">
            <h2>Select Your Figure</h2>
            <button class="id-btn" data-id="chef">Chef</button>
            <button class="id-btn" data-id="professor">Professor</button>
        </div>

        <div id="experience" class="hidden">
            <h2 id="expTitle"></h2>
            <button class="exp-btn">Feel</button>
            <button class="exp-btn">Remember</button>
            <button class="exp-btn">Helpful Step</button>
            <button class="exp-btn">Crumb</button>
        </div>

        <div id="stillStanding" class="hidden">
            <h2>Still Standing</h2>
            <p>You’re still here. That means something.</p>
        </div>
    </div>

    <script src="app.js"></script>
</body>
</html>
